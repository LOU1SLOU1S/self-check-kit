name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is macOS's built-in python3, the oldest version the kit supports.
          # ubuntu-latest (26.04) no longer offers 3.9 in setup-python, so Ubuntu starts at 3.10.
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline test suite
        run: python3 tests/run_tests.py
      - name: Trap repo is a real trap (the obvious fix still fails)
        run: python3 eval/run_trap.py --self-test
